<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Input Types of Html</h2>
    <form>
        <label><b>Enter Name</b></label>
        <input type="text" placeholder="Enter Name">
        <br><br>
        <label><b>Enter Email</b></label>
        <input type="email" placeholder="Enter Email">
        <br><br>
        <label><b>Enter Password</b></label>
        <input type="password" placeholder="Enter Password">
        <br><br>
        <label><b>Enter Number</b></label>
        <input type="number" placeholder="Enter Number">
        <br><br>
        <label><b>Telephone Number</b></label>
        <input type="tel" placeholder="Enter Telephone Number">
        <br><br>
        <label><b>Enter Date Of Birth</b></label>
        <input type="date">
        <br><br>
        <lable>Enter Month of Graduation</lable>
        <input type="Month">
        <br><br>
        <label><b>Enter Date and Time</b></label>
        <input type="datetime-local">
        <br><br>
        <label><b>Week</b></label>
        <input type="week">
        <br><br>
        <label><b>Choose Cities</b></label>
        <input type="checkbox" checked/>Mumbai
        <input type="checkbox" />Pune
        <input type="checkbox"/>Delhi
        <input type="checkbox"/>Noida
        <br><br>
        <label>Gender</label>
        <input type="radio" name="xyz"/>Male
        <input type="radio" name="xyz"/>Female
        <input type="radio" name="xyz"/>Other
        <br><br>
        <label>Select Color</label>
        <input type="color"/>
        <br><br>
        <label>Choose File</label>
        <input type="file"/>
        <br><br>
        <label>Enter Range</label>
        <input type="range"/>
        <br><br>
        <label>Upload Docs</label>
        <input type="file" multiple/>
        <br><br>
        <label>Search</label>
        <input type="search" placeholder="Search here"/>
        <br><br>
        <label>Enter UrL</label>
        <input type="url" placeholder="https://example.com"/>
        <br><br>
        <label>Select City</label>
        <select>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Nashik</option>
            <option>Kolhapur</option>
            <option>Satara</option>
            <option>Solapur</option>
            <option>Jalgaon</option>
            <option>Dhule</option>
            <option>Ahilyanagar</option>
            <option>Beed</option>
        </select><br><br>
        
        <label>Address</label>
        <textarea placeholder="Enter address" rows="5" cols="30"></textarea>
        <br><br>
        <input type="Submit" value="Submit"/>
        <input type="Reset" value="Reset"/>
        <input type="button" value="Button"/>
        <br><br>
    </form>
</body>
</html>
